<div class="form-container">
  <!-- Botón de cerrar -->
  <button style="align-self: flex-end; color: #ffffff;" mat-icon-button class="close-button" (click)="closeDialog()">
    <mat-icon>close</mat-icon>
  </button>

  <form class="form" [formGroup]="profileForm">
    <h1 style="color:#E0E0E0;">Editar Asesor</h1>

    <!-- Seleccionar asesor a editar -->
    <mat-form-field>
      <mat-label>Selecciona asesor</mat-label>
      <mat-select [formControl]="selectedAdviserId" (selectionChange)="loadAdviser($event.value)">
        <mat-option *ngFor="let adv of adviserList" [value]="adv.id">
          {{ adv.name }} {{ adv.lastName }} — {{ adv.email }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="selectedAdviserId.invalid && selectedAdviserId.touched">
        Debes seleccionar un asesor
      </mat-error>
    </mat-form-field>

    <!-- Nombre -->
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput [formControl]="name" required />
      <mat-error *ngIf="name.invalid && name.touched">
        {{ errorMessage(name) }}
      </mat-error>
    </mat-form-field>

    <!-- Apellido -->
    <mat-form-field>
      <mat-label>Apellido</mat-label>
      <input matInput [formControl]="lastName" required />
      <mat-error *ngIf="lastName.invalid && lastName.touched">
        {{ errorMessage(lastName) }}
      </mat-error>
    </mat-form-field>

    <!-- Email -->
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput [formControl]="email" required />
      <mat-error *ngIf="email.invalid && email.touched">
        {{ errorMessage(email) }}
      </mat-error>
    </mat-form-field>

    <!-- Rol -->
    <mat-form-field>
      <mat-select [formControl]="rol">
        <mat-option value="asesor">Asesor</mat-option>
        <mat-option value="ejecutivo">Ejecutivo</mat-option>
      </mat-select>
      <mat-error *ngIf="rol.invalid && rol.touched">
        {{ errorMessage(rol) }}
      </mat-error>
    </mat-form-field>

    <!-- Password -->
    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" [formControl]="password" required />
      <mat-error *ngIf="password.invalid && password.touched">
        {{ errorMessage(password) }}
      </mat-error>
    </mat-form-field>

    <!-- Botón Guardar cambios -->
    <button mat-raised-button color="primary" type="button" (click)="editAdviser()">
      Guardar
    </button>
  </form>
</div>
