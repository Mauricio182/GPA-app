<div style="width: 100%; height: 400px;">
  <ag-grid-angular
    class="ag-theme-alpine"
    style="width: 100%; height: 100%;"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [defaultColDef]="defaultColDef"
    [sideBar]="sideBar"
    [pagination]="true"
    [paginationPageSize]="10"
    [enableRangeSelection]="true"
    (gridReady)="onGridReady($event)">
  </ag-grid-angular>
</div>
    <button style="margin: 10px;" matButton="outlined" (click)="sendTableToDB()">Guardar cambios</button>
    <button style="margin: 10px;" matButton="outlined" (click)="exportPDF()">
      <span style="display: flex; justify-content: center; flex-direction: row; align-items: center;">
        Generar pdf <span class="material-symbols-outlined">
          picture_as_pdf
        </span>
      </span>
    </button>
